name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate versions
        run: scripts/check-release-version.sh "$GITHUB_REF_NAME"

  rust:
    name: Rust (${{ matrix.os }})
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  jvm:
    name: JVM (${{ matrix.os }}, JDK ${{ matrix.java }})
    needs: validate
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
        java: [21, 25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Check JVM projects
        if: runner.os != 'Windows'
        run: >-
          ./gradlew check :jvm-api:javadoc :jvm-client:javadoc :jvm-testkit:javadoc
          generatePomFileForLibraryPublication --no-daemon
      - name: Check JVM projects on Windows
        if: runner.os == 'Windows'
        run: >-
          ./gradlew.bat check :jvm-api:javadoc :jvm-client:javadoc :jvm-testkit:javadoc
          generatePomFileForLibraryPublication --no-daemon

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: validate
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write # Upload CodeQL results for the three declared languages.
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Java and Kotlin
        if: matrix.language == 'java-kotlin'
        run: ./gradlew classes testClasses --no-daemon --no-build-cache
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  packages:
    name: Release package (${{ matrix.name }})
    needs: [validate, rust, jvm, codeql]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: macos-aarch64
            os: macos-15
          - name: macos-x86_64
            os: macos-15-intel
          - name: windows-x86_64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Build Linux package
        if: runner.os == 'Linux'
        run: scripts/package-linux.sh "${GITHUB_REF_NAME#v}"
      - name: Build macOS package
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh "${GITHUB_REF_NAME#v}"
      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/package-windows.ps1 $env:GITHUB_REF_NAME.Substring(1)
      - name: Smoke-test Unix package
        if: runner.os != 'Windows'
        run: scripts/smoke-package.sh dist/*.tar.gz
      - name: Smoke-test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/smoke-package.ps1 (Get-ChildItem dist/*.zip).FullName
      - name: Upload release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  vscode:
    name: Release VSIX
    needs: [validate, rust, jvm, codeql]
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install extension dependencies
        run: npm ci
        working-directory: clients/vscode
      - name: Test extension models and client
        run: npm test
        working-directory: clients/vscode
      - name: Validate extension manifest
        run: npm run validate
        working-directory: clients/vscode
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        working-directory: clients/vscode
      - name: Build VSIX
        run: npm run package
        working-directory: clients/vscode
      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-vsix
          path: dist/*.vsix
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [packages, vscode]
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      attestations: write # Publish build provenance for release artifacts.
      contents: write # Create the tag-associated GitHub Release and upload assets.
      id-token: write # Request the OIDC identity used to sign provenance.
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate aggregate checksums
        run: |
          checksum_file="$(mktemp)"
          pushd dist >/dev/null
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name checksums.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > "$checksum_file"
          mv "$checksum_file" checksums.txt
          popd >/dev/null
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.vsix
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
