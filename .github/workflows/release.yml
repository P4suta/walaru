name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate versions
        run: scripts/check-release-version.sh "$GITHUB_REF_NAME"

  packages:
    name: Release package (${{ matrix.name }})
    needs: validate
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: macos-aarch64
            os: macos-15
          - name: macos-x86_64
            os: macos-15-intel
          - name: windows-x86_64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - name: Build Linux package
        if: runner.os == 'Linux'
        run: scripts/package-linux.sh "${GITHUB_REF_NAME#v}"
      - name: Build macOS package
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh "${GITHUB_REF_NAME#v}"
      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/package-windows.ps1 $env:GITHUB_REF_NAME.Substring(1)
      - name: Smoke-test Unix package
        if: runner.os != 'Windows'
        run: scripts/smoke-package.sh dist/*.tar.gz
      - name: Smoke-test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/smoke-package.ps1 (Get-ChildItem dist/*.zip).FullName
      - name: Upload release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  vscode:
    name: Release VSIX
    needs: validate
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        # zizmor: ignore[cache-poisoning]
        # npm verifies every package against the immutable package-lock integrity digest.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install extension dependencies
        run: npm ci
        working-directory: clients/vscode
      - name: Build VSIX
        run: npm run package
        working-directory: clients/vscode
      - name: Upload VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-vsix
          path: dist/*.vsix
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [packages, vscode]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      attestations: write # Publish build provenance for release artifacts.
      contents: write # Create the tag-associated GitHub Release and upload assets.
      id-token: write # Request the OIDC identity used to sign provenance.
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate aggregate checksums
        run: |
          checksum_file="$(mktemp)"
          pushd dist >/dev/null
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name checksums.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > "$checksum_file"
          mv "$checksum_file" checksums.txt
          popd >/dev/null
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.vsix
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
