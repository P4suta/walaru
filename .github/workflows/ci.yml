name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  jvm:
    name: JVM (${{ matrix.os }}, JDK ${{ matrix.java }})
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        java: [21]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Check JVM projects
        if: runner.os != 'Windows'
        run: >-
          ./gradlew check :jvm-api:javadoc :jvm-client:javadoc :jvm-testkit:javadoc
          generatePomFileForLibraryPublication --no-daemon
      - name: Check JVM projects on Windows
        if: runner.os == 'Windows'
        run: >-
          ./gradlew.bat check :jvm-api:javadoc :jvm-client:javadoc :jvm-testkit:javadoc
          generatePomFileForLibraryPublication --no-daemon

  vscode:
    name: VS Code
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      - name: Install extension dependencies
        run: npm ci
        working-directory: clients/vscode
      - name: Test extension models and client
        run: npm test
        working-directory: clients/vscode
      - name: Validate extension manifest
        run: npm run validate
        working-directory: clients/vscode
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        working-directory: clients/vscode

  repository-lint:
    name: Repository lint
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.17.0
          ACTIONLINT_SHA256: 620abd485a12b6ab1125b844a876414e1d5bd2af8a3125b27f82b01d0d9d6e5a
          ACTIONLINT_DIR: ${{ runner.temp }}/actionlint
        run: |
          mkdir -p "$ACTIONLINT_DIR"
          archive="$ACTIONLINT_DIR/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/kjanat/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$ACTIONLINT_DIR" actionlint
          echo "$ACTIONLINT_DIR" >> "$GITHUB_PATH"
      - name: Install repository lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Install zizmor
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: zizmor@1.31.1
      - name: Lint repository policy
        run: scripts/lint-repository.sh

  rust-security:
    name: Rust dependency policy
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install security tools
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: Check licenses, bans, advisories, and sources
        run: cargo deny check
      - name: Audit Rust lockfile
        run: cargo audit --deny warnings

  dependency-review:
    name: Dependency review
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  security-scan:
    name: Secret and filesystem scan
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read # Resolve the comparison range for pull-request secret scans.
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Scan filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          skip-dirs: target,dist,.gradle,.gradle-user-home

  ci-success:
    name: ci-success
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    needs:
      - rust
      - jvm
      - vscode
      - repository-lint
      - rust-security
      - dependency-review
      - security-scan
    steps:
      - name: Require every CI gate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          read -r -a results <<< "$RESULTS"
          if (( ${#results[@]} != 7 )); then
            echo "Expected 7 CI gate results, received ${#results[@]}: $RESULTS" >&2
            exit 1
          fi
          for result in "${results[@]}"; do
            # GitHub can surface matrix setup failures as `abandoned`; accept only success.
            if [[ "$result" != "success" ]]; then
              echo "CI gate results: $RESULTS" >&2
              exit 1
            fi
          done
          echo "CI gate results: $RESULTS"

  # The one status check branch protection requires,
  # named the same in every P4suta repository.
  # It passes only when every job it needs succeeded or was skipped.
  required:
    name: required
    if: always()
    needs: [ci-success]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          jq -e 'all(.[]; IN("success", "skipped"))' <<< "${RESULTS}"
