version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    labels: [dependencies, rust]
    cooldown:
      default-days: 7
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    labels: [dependencies, jvm]
    cooldown:
      default-days: 7
    groups:
      gradle-dependencies:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /fixtures/maven-testng
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    labels: [dependencies, jvm]
    cooldown:
      default-days: 7
    groups:
      maven-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /clients/vscode
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    labels: [dependencies, vscode]
    cooldown:
      default-days: 7
    groups:
      vscode-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    labels: [dependencies, github-actions]
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
