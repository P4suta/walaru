name: Bug report
description: Report a reproducible Walaru defect
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets or private source. Report vulnerabilities through the Security tab.
  - type: input
    id: version
    attributes:
      label: Walaru revision or version
      placeholder: commit SHA or version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: ["Linux x64", "macOS ARM64", "macOS Intel", "Windows x64", "Other"]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps, command argv, exit code, and redacted diagnostics.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
